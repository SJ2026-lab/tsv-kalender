<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>TSV Kalender</title>
  <link rel="stylesheet" href="style.css?v=11">
</head>
<body>
  <div id="app" class="app-wrapper">
    <p style="text-align:center; padding:40px; color:#64748b; font-family:sans-serif;">Lade TSV Kalender...</p>
  </div>

  <script>
    window.onerror = function(msg, url, line) {
      document.getElementById("app").innerHTML = 
        '<div style="background:#fee2e2;color:#b91c1c;padding:20px;border-radius:12px;font-family:sans-serif;">' +
        '<strong>Fehler gefunden:</strong><br>' + msg + '<br><small>Datei: ' + url + ' (Zeile ' + line + ')</small></div>';
    };
  </script>

  <script src="editor.js?v=1"></script>
  <script src="serien.js?v=1"></script>
  <script src="kalender.js?v=25"></script>
  <script src="app.js?v=44"></script>
</body>
</html>
