<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>TSV Kalender</title>
  <style>
    :root {
      --primary: #0f172a;
      --accent: #10b981;
      --blue: #2563eb;
      --bg: #f1f5f9;
      --card: #ffffff;
      --text: #1e293b;
      --muted: #64748b;
      --border: #e2e8f0;
      --danger: #ef4444;
    }
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 0;
    }
    .app-wrapper { max-width: 540px; margin: 0 auto; padding: 16px 16px 50px; }
    .top-banner {
      background: linear-gradient(135deg, #0f172a 0%, #1e3a8a 100%);
      color: white;
      padding: 22px 20px;
      border-radius: 20px;
      margin-bottom: 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .brand { display: flex; align-items: center; gap: 12px; }
    .club-crest {
      width: 44px; height: 44px; background: var(--accent); color: #064e3b;
      font-weight: 900; font-size: 16px; border-radius: 12px;
      display: flex; align-items: center; justify-content: center;
    }
    .brand h1 { margin: 0; font-size: 20px; }
    .brand p { margin: 0; font-size: 12px; color: #94a3b8; }
    .box {
      background: var(--card); padding: 22px; border-radius: 20px;
      border: 1px solid var(--border); box-shadow: 0 4px 16px rgba(0,0,0,0.04);
    }
    h2 { margin: 0 0 16px; font-size: 20px; color: var(--primary); }
    label {
      display: block; font-size: 12px; font-weight: 700;
      text-transform: uppercase; color: var(--muted); margin-bottom: 5px;
    }
    input, select, textarea {
      display: block; width: 100%; margin-bottom: 14px; padding: 12px 14px;
      font-size: 16px; font-family: inherit; color: var(--text);
      background: #f8fafc; border: 1.5px solid var(--border); border-radius: 12px;
    }
    button {
      display: block; width: 100%; padding: 14px; margin-bottom: 10px;
      font-size: 15px; font-weight: 700; color: white;
      background: var(--primary); border: none; border-radius: 12px; cursor: pointer;
    }
    .btn-success { background: var(--accent); color: #064e3b; }
    .btn-secondary { background: #e2e8f0; color: #334155; }
    .btn-logout {
      background: rgba(255,255,255,0.18); color: white; width: auto;
      padding: 8px 14px; margin: 0; font-size: 13px; border-radius: 10px;
    }
    .hidden { display: none !important; }
    .info-text { font-size: 14px; color: var(--muted); margin: -6px 0 16px; }
    .profile-pill-bar {
      background: #f8fafc; border: 1px solid var(--border); padding: 12px 16px;
      border-radius: 14px; margin-bottom: 16px; display: flex;
      justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px;
    }
    .badge { display: inline-block; padding: 4px 10px; border-radius: 20px; font-size: 11px; font-weight: 700; }
    .badge-admin { background: #fee2e2; color: #b91c1c; }
    .badge-write { background: #fef3c7; color: #b45309; }
    .badge-read { background: #dcfce7; color: #15803d; }
    .form-panel {
      background: #f8fafc; border: 1.5px solid var(--border);
      padding: 16px; border-radius: 16px; margin-bottom: 18px;
    }
    .filter-bar {
      background: var(--card); padding: 14px 16px; border-radius: 16px;
      border: 1px solid var(--border); margin-bottom: 16px;
    }
    .filter-bar select { margin-bottom: 0; }
    .event-card {
      background: var(--card); border: 1px solid var(--border); border-radius: 16px;
      padding: 14px; margin-bottom: 12px; display: flex; gap: 14px; align-items: flex-start;
    }
    .date-badge {
      background: linear-gradient(180deg, #1e3a8a 0%, #0f172a 100%);
      color: white; min-width: 56px; border-radius: 12px;
      text-align: center; padding: 8px 4px; flex-shrink: 0;
    }
    .date-badge .day { font-size: 20px; font-weight: 800; line-height: 1.1; }
    .date-badge .month { font-size: 11px; color: #93c5fd; font-weight: 700; margin-top: 2px; }
    .event-content { flex: 1; min-width: 0; }
    .team-tag {
      display: inline-block; background: #eff6ff; color: #1d4ed8;
      font-size: 11px; font-weight: 700; padding: 3px 9px; border-radius: 20px; margin-bottom: 5px;
    }
    .event-title { font-size: 16px; font-weight: 700; color: var(--primary); margin: 0 0 4px; }
    .event-meta { font-size: 13px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 10px; }
    .event-note { font-size: 13px; color: #475569; background: #f8fafc; padding: 8px; border-radius: 8px; margin-top: 8px; }
    .btn-delete-small {
      background: #fee2e2; color: #dc2626; width: auto; padding: 6px 12px;
      font-size: 12px; border-radius: 8px; margin: 10px 0 0;
    }
  </style>
</head>
<body>
  <div class="app-wrapper">

    <!-- 1. Login -->
    <div id="login-box">
      <div class="top-banner">
        <div class="brand">
          <div class="club-crest">TSV</div>
          <div><h1>TSV Kalender</h1><p>Vereins- & Mannschaftstermine</p></div>
        </div>
      </div>
      <div class="box">
        <h2>Willkommen zurück</h2>
        <label for="login-email">E-Mail</label>
        <input type="email" id="login-email" placeholder="deine@email.de">
        <label for="login-password">Passwort</label>
        <input type="password" id="login-password" placeholder="Passwort">
        <button type="button" id="login-btn">Anmelden</button>
        <button type="button" id="show-register-btn" class="btn-secondary">Neu im Verein? Konto erstellen</button>
        <p id="login-error" style="color:var(--danger); font-size:14px; font-weight:600; margin:0;"></p>
      </div>
    </div>

    <!-- 2. Registrierung -->
    <div id="register-box" class="hidden">
      <div class="top-banner">
        <div class="brand">
          <div class="club-crest">TSV</div>
          <div><h1>Mitglied werden</h1><p>Einmalige Registrierung</p></div>
        </div>
      </div>
      <div class="box">
        <h2>Konto erstellen</h2>
        <p class="info-text">Gib das <strong>Vereinspasswort</strong> ein und wähle deine Funktion.</p>
        <label for="club-password">Vereinspasswort</label>
        <input type="password" id="club-password" placeholder="Vereinspasswort">
        <label for="reg-role">Funktion im Verein</label>
        <select id="reg-role">
          <option value="">Bitte wählen...</option>
          <option value="Eltern">Eltern</option>
          <option value="Trainer">Trainer</option>
          <option value="Jugendleiter">Jugendleiter</option>
          <option value="Vorstand">Vorstand</option>
          <option value="Spartenleiter">Spartenleiter</option>
          <option value="Fan">Fan</option>
        </select>
        <div id="team-wrapper">
          <label for="reg-team">Mannschaft</label>
          <select id="reg-team">
            <option value="">Bitte Mannschaft wählen...</option>
            <option value="U7">U7</option>
            <option value="U9">U9</option>
            <option value="U11">U11</option>
            <option value="U13">U13</option>
            <option value="U15">U15</option>
            <option value="Altherren">Altherren</option>
            <option value="Damen">Damen</option>
            <option value="Erste Mannschaft">Erste Mannschaft</option>
            <option value="2. Mannschaft">2. Mannschaft</option>
          </select>
        </div>
        <label for="reg-email">Deine E-Mail</label>
        <input type="email" id="reg-email" placeholder="name@beispiel.de">
        <label for="reg-password">Eigenes Passwort (min. 6 Zeichen)</label>
        <input type="password" id="reg-password" placeholder="Passwort">
        <button type="button" id="register-btn" class="btn-success">Registrierung abschließen</button>
        <button type="button" id="back-to-login-btn" class="btn-secondary">Zurück zum Login</button>
        <p id="reg-error" style="color:var(--danger); font-size:14px; font-weight:600; margin:0;"></p>
      </div>
    </div>

    <!-- 3. Kalender-Dashboard -->
    <div id="user-section" class="hidden">
      <div class="top-banner">
        <div class="brand">
          <div class="club-crest">TSV</div>
          <div><h1>TSV Termine</h1><p id="user-email" style="color:#cbd5e1;"></p></div>
        </div>
        <button type="button" id="logout-btn" class="btn-logout">Abmelden</button>
      </div>

      <div class="profile-pill-bar">
        <div style="font-size:13px;"><strong id="user-role"></strong><span id="user-team-row"> • <span id="user-team"></span></span></div>
        <div id="user-badges"></div>
      </div>

      <div id="write-area" class="hidden">
        <button type="button" id="toggle-termin-form" class="btn-success">+ Neuen Termin eintragen</button>
        <div id="termin-formular" class="form-panel hidden">
          <h3 style="margin:0 0 12px; font-size:17px;">Neuen Termin anlegen</h3>
          <label for="termin-titel">Veranstaltung / Titel</label>
          <input type="text" id="termin-titel" placeholder="z. B. Heimspiel oder Training">
          <label for="termin-team">Mannschaft</label>
          <select id="termin-team">
            <option value="Alle Mannschaften">Alle Mannschaften</option>
            <option value="U7">U7</option>
            <option value="U9">U9</option>
            <option value="U11">U11</option>
            <option value="U13">U13</option>
            <option value="U15">U15</option>
            <option value="Altherren">Altherren</option>
            <option value="Damen">Damen</option>
            <option value="Erste Mannschaft">Erste Mannschaft</option>
            <option value="2. Mannschaft">2. Mannschaft</option>
          </select>
          <div style="display:flex; gap:10px;">
