<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>TSV Kalender</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: #f2f4f8; margin: 0; padding: 0; color: #1a1d1f; }
  .app { max-width: 480px; margin: 0 auto; min-height: 100vh; background: #ffffff; display: flex; flex-direction: column; position: relative; box-shadow: 0 0 25px rgba(0,0,0,0.06); }
  .auth-wrap { padding: 30px 20px; margin: auto 0; }
  h2 { margin: 0 0 20px; text-align: center; font-size: 1.5rem; font-weight: 800; color: #111; }
  input, select, button { width: 100%; height: 48px; padding: 0 14px; margin: 7px 0; border: 1.5px solid #e2e8f0; border-radius: 12px; font-size: 16px; background: #f8fafc; }
  input:focus, select:focus { outline: none; border-color: #0066ff; background: #fff; }
  button { background: #0066ff; color: #fff; border: none; font-weight: 700; cursor: pointer; }
  button:active { transform: scale(0.98); }
  .btn-sub { background: transparent; color: #0066ff; border: 1.5px solid #0066ff; margin-top: 10px; }
  .hidden { display: none !important; }
  .msg { font-size: 0.9rem; font-weight: 600; margin: 10px 0; color: #e11d48; text-align: center; }

  /* Header & Filter */
  .header { padding: 14px 18px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #f1f5f9; }
  .user-title { font-weight: 800; font-size: 1.05rem; }
  .role-pill { font-size: 0.75rem; background: #eff6ff; color: #0066ff; padding: 3px 9px; border-radius: 20px; font-weight: 700; }
  .btn-out { width: auto; height: 34px; padding: 0 12px; font-size: 0.8rem; background: #f1f5f9; color: #475569; border-radius: 8px; margin: 0; }

  .filters { display: flex; gap: 6px; padding: 10px 16px; overflow-x: auto; scrollbar-width: none; }
  .filters::-webkit-scrollbar { display: none; }
  .chip { width: auto; height: 32px; padding: 0 14px; margin: 0; border-radius: 20px; background: #f1f5f9; color: #475569; font-size: 0.82rem; font-weight: 600; flex-shrink: 0; }
  .chip.active { background: #1e293b; color: #fff; }

  /* Monatsraster (Apple/Google Stil) */
  .cal-box { padding: 6px 14px 14px; border-bottom: 1px solid #f1f5f9; }
  .m-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; padding: 0 4px; }
  .m-bar strong { font-size: 1.15rem; font-weight: 800; }
  .m-btn { width: 36px; height: 36px; border-radius: 50%; background: #f1f5f9; color: #1e293b; padding: 0; margin: 0; font-size: 1rem; }
  .wk-row, .days-grid { display: grid; grid-template-columns: repeat(7, 1fr); text-align: center; }
  .wk-row div { font-size: 0.75rem; font-weight: 700; color: #94a3b8; padding-bottom: 8px; }
  .d-cell { height: 46px; display: flex; flex-direction: column; align-items: center; justify-content: center; border-radius: 12px; cursor: pointer; position: relative; margin: 1px; }
  .d-num { font-size: 0.95rem; font-weight: 600; width: 32px; height: 32px; line-height: 32px; border-radius: 50%; }
  .d-cell.today .d-num { color: #0066ff; font-weight: 800; background: #eff6ff; }
  .d-cell.selected .d-num { background: #0066ff; color: #fff; font-weight: 700; }
  .dots { display: flex; gap: 3px; height: 5px; margin-top: 2px; }
  .dot { width: 5px; height: 5px; border-radius: 50%; }
  .c-U11 { background: #10b981; } .c-U13 { background: #f59e0b; } .c-U15 { background: #8b5cf6; } .c-Alle { background: #06b6d4; }

  /* Tages-Agenda unten */
  .agenda { flex: 1; padding: 16px 18px 85px; background: #f8fafc; }
  .ag-head { font-size: 0.9rem; font-weight: 800; color: #64748b; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 12px; }
  .ev-card { background: #fff; border-radius: 14px; padding: 14px 16px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 2px 8px rgba(0,0,0,0.04); border-left: 5px solid #0066ff; }
  .b-U11 { border-left-color: #10b981; } .b-U13 { border-left-color: #f59e0b; } .b-U15 { border-left-color: #8b5cf6; } .b-Alle { border-left-color: #06b6d4; }
  .ev-team { font-size: 0.75rem; font-weight: 800; text-transform: uppercase; color: #64748b; margin-bottom: 3px; }
  .ev-title { font-size: 1rem; font-weight: 700; color: #0f172a; }
  .del-ic { width: 32px; height: 32px; border-radius: 8px; background: #fff1f2; color: #e11d48; display: flex; align-items: center; justify-content: center; font-weight: bold; cursor: pointer; }

  /* Floating Action Button (+) & Modal */
  .fab { position: fixed; bottom: 22px; right: 22px; width: 56px; height: 56px; border-radius: 50%; background: #0066ff; color: #fff; font-size: 28px; box-shadow: 0 6px 20px rgba(0,102,255,0.4); display: flex; align-items: center; justify-content: center; z-index: 10; }
  .modal-bg { position: fixed; inset: 0; background: rgba(15,23,42,0.5); display: flex; align-items: flex-end; justify-content: center; z-index: 20; }
  .modal { background: #fff; width: 100%; max-width: 480px; border-radius: 22px 22px 0 0; padding: 22px 20px 30px; }
  .modal-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
</style>
</head>
<body>
<div class="app">
  <!-- LOGIN -->
  <div id="v-login" class="auth-wrap">
    <h2>TSV Kalender</h2>
    <input type="email" id="l-mail" placeholder="E-Mail-Adresse">
    <input type="password" id="l-pass" placeholder="Passwort">
    <button type="button" onclick="doLogin()">Einloggen</button>
    <div id="l-msg" class="msg"></div>
    <button type="button" class="btn-sub" onclick="go('v-reg')">Neues Konto erstellen</button>
  </div>

  <!-- REGISTRIERUNG -->
  <div id="v-reg" class="auth-wrap hidden">
    <h2>Registrieren</h2>
    <input type="text" id="r-name" placeholder="Vor- und Nachname">
    <input type="email" id="r-mail" placeholder="E-Mail-Adresse">
    <input type="password" id="r-p1" placeholder="Passwort (min. 6 Zeichen)" autocomplete="new-password">
    <input type="password" id="r-p2" placeholder="Passwort wiederholen" autocomplete="new-password">
    <select id="r-role" onchange="roleUI()">
      <option value="" disabled selected>Rolle wählen...</option>
      <option value="Eltern">Eltern (Nur Ansicht)</option>
      <option value="Trainer">Trainer (Eigene Mannschaft)</option>
      <option value="Jugendleiter">Jugendleiter (Alle bearbeiten)</option>
      <option value="Vorstand">Vorstand / Admin (Alle bearbeiten)</option>
    </select>
    <select id="r-team" class="hidden">
      <option value="" disabled selected>Mannschaft wählen...</option>
      <option value="U11">U11</option><option value="U13">U13</option><option value="U15">U15</option>
    </select>
    <input type="password" id="r-code" class="hidden" placeholder="Vereins-Code (Verein2026)">
    <button type="button" onclick="doReg()">Konto erstellen</button>
    <div id="r-msg" class="msg"></div>
    <button type="button" class="btn-sub" onclick="go('v-login')">Zurück zum Login</button>
  </div>

  <!-- HAUPT-APP -->
  <div id="v-app" class="hidden" style="display:flex; flex-direction:column; flex:1;">
    <div class="header">
      <div>
        <div class="user-title" id="u-name">Hallo!</div>
        <span class="role-pill" id="u-role">Rolle</span>
      </div>
      <button type="button" class="btn-out" onclick="doLogout()">Logout</button>
    </div>

    <div class="filters">
      <button type="button" class="chip active" onclick="setFilter('ALL', this)">Alle</button>
      <button type="button" class="chip" onclick="setFilter('U11', this)">U11</button>
      <button type="button" class="chip" onclick="setFilter('U13', this)">U13</button>
      <button type="button" class="chip" onclick="setFilter('U15', this)">U15</button>
      <button type="button" class="chip" onclick="setFilter('Alle', this)">Verein</button>
    </div>

    <div class="cal-box">
      <div class="m-bar">
        <button type="button" class="m-btn" onclick="stepMonth(-1)">&#8249;</button>
        <strong id="m-lbl">Monat Jahr</strong>
        <button type="button" class="m-btn" onclick="stepMonth(1)">&#8250;</button>
      </div>
      <div class="wk-row"><div>Mo</div><div>Di</div><div>Mi</div><div>Do</div><div>Fr</div><div>Sa</div><div>So</div></div>
      <div class="days-grid" id="days-grid"></div>
    </div>

    <div class="agenda">
      <div class="ag-head" id="ag-date-lbl">Termine</div>
      <div id="ag-list"></div>
    </div>

    <button type="button" id="fab-add" class="fab hidden" onclick="openModal()">+</button>
  </div>

  <!-- TERMIN-MODAL (Bottom Sheet) -->
  <div id="modal-bg" class="modal-bg hidden" onclick="if(event.target===this)closeModal()">
    <div class="modal">
      <div class="modal-top">
        <strong style="font-size:1.15rem;">Neuer Termin</strong>
        <span style="font-size:1.4rem; cursor:pointer; color:#64748b;" onclick="closeModal()">✕</span>
      </div>
      <input type="date" id="e-date">
      <input type="text" id="e-title" placeholder="z.B. 17:00 Training / Heimspiel">
      <select id="e-team"><option value="U11">U11</option><option value="U13">U13</option><option value="U15">U15</option><option value="Alle">Gesamter Verein</option></select>
      <button type="button" onclick="addEv()">Termin speichern</button>
    </div>
  </div>
</div>

  
  <script>
var KEY = "AIzaSyDATRJtGAkTVg-dB1AkI5jlEwNgBBIK-z8";
var P = "https:" + "//";
var COM = "oogleapis." + "com";
var AUTH_URL = P + "identitytoolkit.g" + COM + "/v1/accounts:";
var DB_URL = P + "firestore.g" + COM + "/v1/projects/kalendertsv/databases/(default)/documents";
var CODE = "Verein2026";
var token = null, user = null, curDate = new Date(), events = [];

function req(method, url, body, authTok, cb) {
  var x = new XMLHttpRequest();
  x.open(method, url, true);
  x.setRequestHeader("Content-Type", "application/json");
  if (authTok) x.setRequestHeader("Authorization", "Bearer " + authTok);
  x.onload = function() {
    var data = {};
    try { data = JSON.parse(x.responseText); } catch(e) {}
    cb(x.status >= 200 && x.status < 300, data);
  };
  x.onerror = function() { cb(false, {error: {message: "Netzwerkfehler"}}); };
  x.send(body ? JSON.stringify(body) : null);
}

function go(id) {
  document.getElementById('v-login').classList.add('hidden');
  document.getElementById('v-reg').classList.add('hidden');
  document.getElementById('v-app').classList.add('hidden');
  document.getElementById(id).classList.remove('hidden');
}

function roleUI() {
  var r = document.getElementById('r-role').value;
  document.getElementById('r-team').classList.toggle('hidden', r !== 'Trainer');
  document.getElementById('r-code').classList.toggle('hidden', r === 'Eltern' || !r);
}

function doReg() {
  var m = document.getElementById('r-msg');
  var name = document.getElementById('r-name').value.trim();
  var mail = document.getElementById('r-mail').value.trim();
  var p1 = document.getElementById('r-p1').value;
  var p2 = document.getElementById('r-p2').value;
  var role = document.getElementById('r-role').value;
  var team = role === 'Trainer' ? document.getElementById('r-team').value : "";
  var code = document.getElementById('r-code').value.trim();
  if (!name || !mail || !p1 || !role) { m.innerText = "Alle Felder ausfüllen!"; return; }
  if (p1 !== p2) { m.innerText = "Passwörter ungleich!"; return; }
  if (role === 'Trainer' && !team) { m.innerText = "Mannschaft wählen!"; return; }
  if (role !== 'Eltern' && code !== CODE) { m.innerText = "Falscher Code!"; return; }
  m.innerText = "Erstelle Konto...";
  req("POST", AUTH_URL + "signUp?key=" + KEY, {email: mail, password: p1, returnSecureToken: true}, null, function(ok, d) {
    if (!ok) { m.innerText = "Auth-Fehler: " + (d.error ? d.error.message : "Fehler"); return; }
    token = d.idToken;
    req("PATCH", DB_URL + "/users/" + d.localId, {fields: {name: {stringValue: name}, role: {stringValue: role}, team: {stringValue: team}}}, token, function(dbOk, de) {
      if (!dbOk) { m.innerText = "DB-Fehler: " + (de.error ? de.error.message : "Zugriff verweigert"); return; }
      m.innerText = ""; user = {name: name, role: role, team: team}; startApp();
    });
  });
}

function doLogin() {
  var m = document.getElementById('l-msg');
  var mail = document.getElementById('l-mail').value.trim();
  var pass = document.getElementById('l-pass').value;
  if (!mail || !pass) { m.innerText = "E-Mail & Passwort eingeben!"; return; }
  m.innerText = "Logge ein...";
  req("POST", AUTH_URL + "signInWithPassword?key=" + KEY, {email: mail, password: pass, returnSecureToken: true}, null, function(ok, d) {
    if (!ok) { m.innerText = "Login-Fehler: " + (d.error ? d.error.message : "Falsch"); return; }
    token = d.idToken;
    req("GET", DB_URL + "/users/" + d.localId, null, token, function(uOk, uData) {
      if (!uOk || !uData.fields) { m.innerText = "Kein Profil gefunden!"; return; }
      m.innerText = ""; user = { name: uData.fields.name.stringValue, role: uData.fields.role.stringValue, team: uData.fields.team ? uData.fields.team.stringValue : "" }; startApp();
    });
  });
}

function doLogout() { token = null; user = null; go('v-login'); }

function startApp() {
  go('v-app');
  document.getElementById('u-info').innerText = user.name + " (" + user.role + (user.team ? " - " + user.team : "") + ")";
  var ed = document.getElementById('ed-box');
  if (user.role === 'Eltern') { ed.classList.add('hidden'); }
  else {
    ed.classList.remove('hidden');
    if (user.role === 'Trainer') document.getElementById('e-team').innerHTML = '<option value="'+user.team+'">'+user.team+'</option>';
  }
  loadEv();
}

function loadEv() {
  if (!token) return;
  req("GET", DB_URL + "/events", null, token, function(ok, d) {
    events = (d.documents || []).map(function(doc) {
      return { id: doc.name.split('/').pop(), date: doc.fields.date.stringValue, title: doc.fields.title.stringValue, team: doc.fields.team.stringValue };
    });
    drawCal();
  });
}

function addEv() {
  var date = document.getElementById('e-date').value;
  var title = document.getElementById('e-title').value.trim();
  var team = user.role === 'Trainer' ? user.team : document.getElementById('e-team').value;
  if (!date || !title) { alert("Datum und Titel eingeben!"); return; }
  req("POST", DB_URL + "/events", {fields: {date: {stringValue: date}, title: {stringValue: title}, team: {stringValue: team}}}, token, function() {
    document.getElementById('e-title').value = ""; loadEv();
  });
}

function delEv(id) {
  if (!confirm("Löschen?")) return;
  req("DELETE", DB_URL + "/events/" + id, null, token, function() { loadEv(); });
}

function stepMonth(s) { curDate.setMonth(curDate.getMonth() + s); drawCal(); }

function drawCal() {
  var y = curDate.getFullYear(), m = curDate.getMonth();
  var names = ['Januar','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'];
  document.getElementById('m-lbl').innerText = names[m] + " " + y;
  var g = document.getElementById('cal-grid');
  g.innerHTML = "";
  var first = (new Date(y, m, 1).getDay() + 6) % 7;
  var days = new Date(y, m + 1, 0).getDate();
  for (var i = 0; i < first; i++) g.innerHTML += '<div></div>';
  for (var d = 1; d <= days; d++) {
    var ds = y + "-" + String(m+1).padStart(2,'0') + "-" + String(d).padStart(2,'0');
    var h = "";
    events.filter(function(e) { return e.date === ds; }).forEach(function(e) {
      var ok = user.role === 'Vorstand' || user.role === 'Jugendleiter' || (user.role === 'Trainer' && e.team === user.team);
      h += '<div class="ev ev-'+e.team+'"><span>['+e.team+'] '+e.title+'</span>'+(ok ? '<b style="cursor:pointer" onclick="delEv(\''+e.id+'\')">×</b>' : '')+'</div>';
    });
    g.innerHTML += '<div class="day"><b>'+d+'</b>'+h+'</div>';
  }
}
</script>
</body>
</html>
